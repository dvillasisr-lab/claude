        If(Last(colPath).Id <> varCEOId, Collect(colPath, {Id: IfError(UsuariosdeOffice365.ManagerV2(Last(colPath).Id).id, varCEOId)}));
        If(Last(colPath).Id <> varCEOId, Collect(colPath, {Id: IfError(UsuariosdeOffice365.ManagerV2(Last(colPath).Id).id, varCEOId)}));
        If(Last(colPath).Id <> varCEOId, Collect(colPath, {Id: IfError(UsuariosdeOffice365.ManagerV2(Last(colPath).Id).id, varCEOId)}));
        If(Last(colPath).Id <> varCEOId, Collect(colPath, {Id: IfError(UsuariosdeOffice365.ManagerV2(Last(colPath).Id).id, varCEOId)}));
