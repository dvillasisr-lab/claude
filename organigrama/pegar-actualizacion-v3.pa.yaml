      Width: =140
      Height: =36
      Fill: =ColorValue("#202054")
      HoverFill: =ColorValue("#4A4A8A")
      PressedFill: =ColorValue("#4A4A8A")
      Color: =Color.White
      HoverColor: =Color.White
      BorderColor: =Color.White
      BorderThickness: =1
      Size: =11
      RadiusTopLeft: =18
      RadiusTopRight: =18
      RadiusBottomLeft: =18
      RadiusBottomRight: =18
      OnSelect: |-
        =ClearCollect(colNiveles, {Nivel: 1, Padre: "ROOT", Sel: ""}); Set(varVerPanel, false); Set(varCargando, false)
- galBuscar:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Items: |-
        =If(Len(txtBuscar.Text) >= 2, UsuariosdeOffice365.SearchUserV2({searchTerm: txtBuscar.Text, top: 6}).value)
      X: =txtBuscar.X
      Y: =56
      Width: =296
      Height: =288
      TemplateSize: =48
      TemplatePadding: =0
      Fill: =Color.White
      BorderColor: =ColorValue("#E3E3E3")
      BorderThickness: =1
      Visible: =Len(txtBuscar.Text) >= 2
      OnSelect: |-
        =Set(varVerPanel, false);
        Set(varCargando, true);
        Set(varLocate, ThisItem.Id);
        Set(varCEOId, LookUp(colGente, Padre = "ROOT").Id);
        ClearCollect(colPath, {Id: varLocate});
        If(Last(colPath).Id <> varCEOId, Collect(colPath, {Id: IfError(UsuariosdeOffice365.ManagerV2(Last(colPath).Id).id, varCEOId)}));
        If(Last(colPath).Id <> varCEOId, Collect(colPath, {Id: IfError(UsuariosdeOffice365.ManagerV2(Last(colPath).Id).id, varCEOId)}));
        If(Last(colPath).Id <> varCEOId, Collect(colPath, {Id: IfError(UsuariosdeOffice365.ManagerV2(Last(colPath).Id).id, varCEOId)}));
        If(Last(colPath).Id <> varCEOId, Collect(colPath, {Id: IfError(UsuariosdeOffice365.ManagerV2(Last(colPath).Id).id, varCEOId)}));
        If(Last(colPath).Id <> varCEOId, Collect(colPath, {Id: IfError(UsuariosdeOffice365.ManagerV2(Last(colPath).Id).id, varCEOId)}));
        If(Last(colPath).Id <> varCEOId, Collect(colPath, {Id: IfError(UsuariosdeOffice365.ManagerV2(Last(colPath).Id).id, varCEOId)}));
        If(Last(colPath).Id <> varCEOId, Collect(colPath, {Id: IfError(UsuariosdeOffice365.ManagerV2(Last(colPath).Id).id, varCEOId)}));
        If(Last(colPath).Id <> varCEOId, Collect(colPath, {Id: IfError(UsuariosdeOffice365.ManagerV2(Last(colPath).Id).id, varCEOId)}));
        Set(varDepth, CountRows(colPath));
        ClearCollect(colNiveles, {Nivel: 1, Padre: "ROOT", Sel: varCEOId});
        If(varDepth >= 1, With({n: Index(colPath, varDepth - 1 + 1).Id},
            If(IsEmpty(Filter(colGente, Padre = n)), ClearCollect(colTmp, ForAll(Filter(UsuariosdeOffice365.DirectReportsV2(n).value, !IsBlank(mail)), {Padre: n, Id: id, Nombre: displayName, Puesto: jobTitle, Depto: department, Correo: Lower(mail), Tel: Coalesce(mobilePhone, First(businessPhones).Value), Foto: UsuariosdeOffice365.UserPhotoMetadata(id).HasPhoto, Reportes: CountRows(UsuariosdeOffice365.DirectReportsV2(id).value)})); Collect(colGente, Filter(colTmp, !(Id in colGente.Id))));
            false
        ));
        If(varDepth >= 2, With({n: Index(colPath, varDepth - 2 + 1).Id},
            If(IsEmpty(Filter(colGente, Padre = n)), ClearCollect(colTmp, ForAll(Filter(UsuariosdeOffice365.DirectReportsV2(n).value, !IsBlank(mail)), {Padre: n, Id: id, Nombre: displayName, Puesto: jobTitle, Depto: department, Correo: Lower(mail), Tel: Coalesce(mobilePhone, First(businessPhones).Value), Foto: UsuariosdeOffice365.UserPhotoMetadata(id).HasPhoto, Reportes: CountRows(UsuariosdeOffice365.DirectReportsV2(id).value)})); Collect(colGente, Filter(colTmp, !(Id in colGente.Id))));
            Collect(colNiveles, {Nivel: 2, Padre: Index(colPath, varDepth - 2 + 2).Id, Sel: n})
        ));
        If(varDepth >= 3, With({n: Index(colPath, varDepth - 3 + 1).Id},
            If(IsEmpty(Filter(colGente, Padre = n)), ClearCollect(colTmp, ForAll(Filter(UsuariosdeOffice365.DirectReportsV2(n).value, !IsBlank(mail)), {Padre: n, Id: id, Nombre: displayName, Puesto: jobTitle, Depto: department, Correo: Lower(mail), Tel: Coalesce(mobilePhone, First(businessPhones).Value), Foto: UsuariosdeOffice365.UserPhotoMetadata(id).HasPhoto, Reportes: CountRows(UsuariosdeOffice365.DirectReportsV2(id).value)})); Collect(colGente, Filter(colTmp, !(Id in colGente.Id))));
            Collect(colNiveles, {Nivel: 3, Padre: Index(colPath, varDepth - 3 + 2).Id, Sel: n})
        ));
        If(varDepth >= 4, With({n: Index(colPath, varDepth - 4 + 1).Id},
            If(IsEmpty(Filter(colGente, Padre = n)), ClearCollect(colTmp, ForAll(Filter(UsuariosdeOffice365.DirectReportsV2(n).value, !IsBlank(mail)), {Padre: n, Id: id, Nombre: displayName, Puesto: jobTitle, Depto: department, Correo: Lower(mail), Tel: Coalesce(mobilePhone, First(businessPhones).Value), Foto: UsuariosdeOffice365.UserPhotoMetadata(id).HasPhoto, Reportes: CountRows(UsuariosdeOffice365.DirectReportsV2(id).value)})); Collect(colGente, Filter(colTmp, !(Id in colGente.Id))));
            Collect(colNiveles, {Nivel: 4, Padre: Index(colPath, varDepth - 4 + 2).Id, Sel: n})
        ));
        If(varDepth >= 5, With({n: Index(colPath, varDepth - 5 + 1).Id},
            If(IsEmpty(Filter(colGente, Padre = n)), ClearCollect(colTmp, ForAll(Filter(UsuariosdeOffice365.DirectReportsV2(n).value, !IsBlank(mail)), {Padre: n, Id: id, Nombre: displayName, Puesto: jobTitle, Depto: department, Correo: Lower(mail), Tel: Coalesce(mobilePhone, First(businessPhones).Value), Foto: UsuariosdeOffice365.UserPhotoMetadata(id).HasPhoto, Reportes: CountRows(UsuariosdeOffice365.DirectReportsV2(id).value)})); Collect(colGente, Filter(colTmp, !(Id in colGente.Id))));
            Collect(colNiveles, {Nivel: 5, Padre: Index(colPath, varDepth - 5 + 2).Id, Sel: n})
        ));
        If(varDepth >= 6, With({n: Index(colPath, varDepth - 6 + 1).Id},
            If(IsEmpty(Filter(colGente, Padre = n)), ClearCollect(colTmp, ForAll(Filter(UsuariosdeOffice365.DirectReportsV2(n).value, !IsBlank(mail)), {Padre: n, Id: id, Nombre: displayName, Puesto: jobTitle, Depto: department, Correo: Lower(mail), Tel: Coalesce(mobilePhone, First(businessPhones).Value), Foto: UsuariosdeOffice365.UserPhotoMetadata(id).HasPhoto, Reportes: CountRows(UsuariosdeOffice365.DirectReportsV2(id).value)})); Collect(colGente, Filter(colTmp, !(Id in colGente.Id))));
            Collect(colNiveles, {Nivel: 6, Padre: Index(colPath, varDepth - 6 + 2).Id, Sel: n})
        ));
        If(varDepth >= 7, With({n: Index(colPath, varDepth - 7 + 1).Id},
            If(IsEmpty(Filter(colGente, Padre = n)), ClearCollect(colTmp, ForAll(Filter(UsuariosdeOffice365.DirectReportsV2(n).value, !IsBlank(mail)), {Padre: n, Id: id, Nombre: displayName, Puesto: jobTitle, Depto: department, Correo: Lower(mail), Tel: Coalesce(mobilePhone, First(businessPhones).Value), Foto: UsuariosdeOffice365.UserPhotoMetadata(id).HasPhoto, Reportes: CountRows(UsuariosdeOffice365.DirectReportsV2(id).value)})); Collect(colGente, Filter(colTmp, !(Id in colGente.Id))));
            Collect(colNiveles, {Nivel: 7, Padre: Index(colPath, varDepth - 7 + 2).Id, Sel: n})
        ));
        If(varDepth >= 8, With({n: Index(colPath, varDepth - 8 + 1).Id},
            If(IsEmpty(Filter(colGente, Padre = n)), ClearCollect(colTmp, ForAll(Filter(UsuariosdeOffice365.DirectReportsV2(n).value, !IsBlank(mail)), {Padre: n, Id: id, Nombre: displayName, Puesto: jobTitle, Depto: department, Correo: Lower(mail), Tel: Coalesce(mobilePhone, First(businessPhones).Value), Foto: UsuariosdeOffice365.UserPhotoMetadata(id).HasPhoto, Reportes: CountRows(UsuariosdeOffice365.DirectReportsV2(id).value)})); Collect(colGente, Filter(colTmp, !(Id in colGente.Id))));
            Collect(colNiveles, {Nivel: 8, Padre: Index(colPath, varDepth - 8 + 2).Id, Sel: n})
        ));
        If(varDepth >= 9, With({n: Index(colPath, varDepth - 9 + 1).Id},
            If(IsEmpty(Filter(colGente, Padre = n)), ClearCollect(colTmp, ForAll(Filter(UsuariosdeOffice365.DirectReportsV2(n).value, !IsBlank(mail)), {Padre: n, Id: id, Nombre: displayName, Puesto: jobTitle, Depto: department, Correo: Lower(mail), Tel: Coalesce(mobilePhone, First(businessPhones).Value), Foto: UsuariosdeOffice365.UserPhotoMetadata(id).HasPhoto, Reportes: CountRows(UsuariosdeOffice365.DirectReportsV2(id).value)})); Collect(colGente, Filter(colTmp, !(Id in colGente.Id))));
            Collect(colNiveles, {Nivel: 9, Padre: Index(colPath, varDepth - 9 + 2).Id, Sel: n})
        ));
        If(!IsEmpty(Filter(colGente, Padre = varLocate)), Collect(colNiveles, {Nivel: varDepth + 1, Padre: varLocate, Sel: ""}));
        Set(varCargando, false);
        Reset(txtBuscar)
    Children:
      - lblSearchItem:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.DisplayName & "  ·  " & ThisItem.JobTitle
            X: =14
            Y: =0
            Width: =Parent.TemplateWidth - 28
            Height: =48
            Size: =12
            Color: =ColorValue("#202054")
            HoverFill: =ColorValue("#EEEEF5")
            OnSelect: =Select(Parent)
