- galNiveles:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Items: =Sort(colNiveles, Nivel)
      X: =0
      Y: =112
      Width: =Parent.Width
      Height: =Parent.Height - 112
      TemplateSize: =190
      TemplatePadding: =0
      ShowScrollbar: =true
      Default: =Last(Sort(colNiveles, Nivel))
    Children:
      - lblRowW:
          Control: Label@2.5.1
          Properties:
            Text: =Min(CountRows(Filter(colGente, Padre = ThisItem.Padre)) * 300, Parent.TemplateWidth - 40)
            X: =0
            Y: =0
            Width: =10
            Height: =10
            Size: =8
            Color: =ColorValue("#87878F")
            Visible: =false
      - lblRowX:
          Control: Label@2.5.1
          Properties:
            Text: =(Parent.TemplateWidth - Min(CountRows(Filter(colGente, Padre = ThisItem.Padre)) * 300, Parent.TemplateWidth - 40)) / 2
            X: =0
            Y: =0
            Width: =10
            Height: =10
            Size: =8
            Color: =ColorValue("#87878F")
            Visible: =false
      - lblPX:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(ThisItem.Nivel = 1, Parent.TemplateWidth / 2, With({t: Sort(Filter(colGente, Padre = LookUp(colGente, Id = ThisItem.Padre).Padre), Nombre)}, With({w: Min(CountRows(t) * 300, Parent.TemplateWidth - 40)}, (Parent.TemplateWidth - w) / 2 + Min((Max(ForAll(Sequence(CountRows(t)), If(Index(t, Value).Id = ThisItem.Padre, Value)), Value) - 1) * 300, w - 300) + 150)))
            X: =0
            Y: =0
            Width: =10
            Height: =10
            Size: =8
            Color: =ColorValue("#87878F")
            Visible: =false
      - lblSelX:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With({t: Sort(Filter(colGente, Padre = ThisItem.Padre), Nombre)}, With({w: Min(CountRows(t) * 300, Parent.TemplateWidth - 40)}, (Parent.TemplateWidth - w) / 2 + Min((Max(ForAll(Sequence(CountRows(t)), If(Index(t, Value).Id = ThisItem.Sel, Value)), Value) - 1) * 300, w - 300) + 150))
            X: =0
            Y: =0
            Width: =10
            Height: =10
            Size: =8
            Color: =ColorValue("#87878F")
            Visible: =false
      - linUp:
          Control: Rectangle@2.3.0
          Properties:
            X: =Value(lblPX.Text) - 1
            Y: =0
            Width: =2
            Height: =31
            Fill: =ColorValue("#87878F")
            Visible: =ThisItem.Nivel > 1
      - linH:
          Control: Rectangle@2.3.0
          Properties:
            X: =Min(Value(lblPX.Text), Value(lblRowX.Text) + 150) - 1
            Y: =29
            Width: =Max(Value(lblPX.Text), Value(lblRowX.Text) + Value(lblRowW.Text) - 150) - Min(Value(lblPX.Text), Value(lblRowX.Text) + 150) + 2
            Height: =2
            Fill: =ColorValue("#87878F")
            Visible: =ThisItem.Nivel > 1
      - linDown:
          Control: Rectangle@2.3.0
          Properties:
            X: =Value(lblSelX.Text) - 1
            Y: =166
            Width: =2
            Height: =24
            Fill: =ColorValue("#87878F")
            Visible: =!IsBlank(ThisItem.Sel) && ThisItem.Nivel < Max(colNiveles, Nivel)
      - lblNivel:
          Control: Label@2.5.1
          Properties:
            Text: =If(ThisItem.Padre = "ROOT", "LEADERSHIP", Upper(LookUp(colGente, Id = ThisItem.Padre).Nombre) & "'S TEAM") & "  ·  " & CountRows(Filter(colGente, Padre = ThisItem.Padre))
            X: =If(Value(lblPX.Text) + 352 > Parent.TemplateWidth, Value(lblPX.Text) - 352, Value(lblPX.Text) + 12)
            Y: =4
            Width: =340
            Height: =22
            Size: =10
            Color: =ColorValue("#87878F")
            Align: =If(Value(lblPX.Text) + 352 > Parent.TemplateWidth, Align.Right, Align.Left)
            FontWeight: =FontWeight.Semibold
      - galPersonas:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            Items: =Sort(Filter(colGente, Padre = ThisItem.Padre), Nombre)
            X: =Value(lblRowX.Text)
            Y: =30
            Width: =Value(lblRowW.Text)
            Height: =140
            TemplateSize: =300
            TemplatePadding: =0
            ShowScrollbar: =false
            ShowNavigation: =true
            Default: =LookUp(Filter(colGente, Padre = ThisItem.Padre), Id = ThisItem.Sel)
            OnSelect: |-
              =If(!varCargando,
                  Set(varCargando, true);
                  Set(varNivel, LookUp(colNiveles, Padre = ThisItem.Padre).Nivel);
                  RemoveIf(colNiveles, Nivel > varNivel);
                  If(
                      LookUp(colNiveles, Nivel = varNivel).Sel = ThisItem.Id,
                      Patch(colNiveles, LookUp(colNiveles, Nivel = varNivel), {Sel: ""}),
                      Patch(colNiveles, LookUp(colNiveles, Nivel = varNivel), {Sel: ThisItem.Id});
                      If(ThisItem.Reportes > 0,
                          If(IsEmpty(Filter(colGente, Padre = ThisItem.Id)),
                              ClearCollect(colTmp, ForAll(Filter(UsuariosdeOffice365.DirectReportsV2(ThisItem.Id).value, !IsBlank(mail)), {Padre: ThisItem.Id, Id: id, Nombre: displayName, Puesto: jobTitle, Depto: department, Correo: Lower(mail), Tel: Coalesce(mobilePhone, First(businessPhones).Value), Foto: UsuariosdeOffice365.UserPhotoMetadata(id).HasPhoto, Reportes: CountRows(UsuariosdeOffice365.DirectReportsV2(id).value)}));
                              Collect(colGente, Filter(colTmp, !(Id in colGente.Id)))
                          );
                          Collect(colNiveles, {Nivel: varNivel + 1, Padre: ThisItem.Id, Sel: ""})
                      )
                  );
                  Set(varCargando, false)
              )
          Children:
            - linStub:
                Control: Rectangle@2.3.0
                Properties:
                  X: =Parent.TemplateWidth / 2 - 1
                  Y: =0
                  Width: =2
                  Height: =10
                  Fill: =ColorValue("#87878F")
            - lblArrow:
                Control: Label@2.5.1
                Properties:
                  Text: ="▼"
                  X: =Parent.TemplateWidth / 2 - 8
                  Y: =2
                  Width: =16
                  Height: =12
                  Size: =7
                  Color: =ColorValue("#87878F")
                  Align: =Align.Center
                  PaddingTop: =0
                  PaddingBottom: =0
            - btnCard:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  Tooltip: ="Click to show or hide this person's team"
                  X: =6
                  Y: =14
                  Width: =Parent.TemplateWidth - 12
                  Height: =122
                  Fill: =If(ThisItem.Id in colNiveles.Sel, ColorValue("#EEEEF5"), Color.White)
                  HoverFill: =ColorValue("#EEEEF5")
                  PressedFill: =ColorValue("#E2E2EE")
                  BorderColor: =If(ThisItem.Id in colNiveles.Sel, ColorValue("#202054"), ColorValue("#E3E3E3"))
                  HoverBorderColor: =ColorValue("#202054")
                  BorderThickness: =If(ThisItem.Id in colNiveles.Sel, 2, 1)
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  OnSelect: =Select(Parent)
            - circAvatar:
                Control: Circle@2.3.0
                Properties:
                  X: =22
                  Y: =32
                  Width: =60
                  Height: =60
                  Fill: =Switch(ThisItem.Depto, "Executive", ColorValue("#202054"), "Finance", ColorValue("#4A4A8A"), "Human Resources", ColorValue("#87878F"), ColorValue("#4A4A8A"))
                  OnSelect: =Select(Parent)
            - lblInitials:
                Control: Label@2.5.1
                Properties:
                  Text: =Upper(Concat(FirstN(Split(ThisItem.Nombre, " "), 2), Left(Value, 1)))
                  X: =22
                  Y: =32
                  Width: =60
                  Height: =60
                  Size: =18
                  Color: =Color.White
                  Align: =Align.Center
                  FontWeight: =FontWeight.Bold
                  OnSelect: =Select(Parent)
            - imgPhoto:
                Control: Image@2.2.3
                Properties:
                  Image: =If(ThisItem.Foto, UsuariosdeOffice365.UserPhotoV2(ThisItem.Id))
                  X: =22
                  Y: =32
                  Width: =60
                  Height: =60
                  ImagePosition: =ImagePosition.Fill
                  RadiusTopLeft: =30
                  RadiusTopRight: =30
                  RadiusBottomLeft: =30
                  RadiusBottomRight: =30
                  Visible: =ThisItem.Foto
                  OnSelect: =Select(Parent)
            - lblName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Nombre
                  X: =96
                  Y: =28
                  Width: =Parent.TemplateWidth - 150
                  Height: =26
                  Size: =14
                  Color: =ColorValue("#202054")
                  FontWeight: =FontWeight.Bold
                  Wrap: =false
                  OnSelect: =Select(Parent)
            - lblJobTitle:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Puesto
                  X: =96
                  Y: =54
                  Width: =Parent.TemplateWidth - 110
                  Height: =20
                  Size: =11
                  Color: =ColorValue("#565656")
                  Wrap: =false
                  OnSelect: =Select(Parent)
            - lblDept:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Depto
                  X: =96
                  Y: =72
                  Width: =Parent.TemplateWidth - 110
                  Height: =18
                  Size: =10
                  Color: =ColorValue("#87878F")
                  Wrap: =false
                  OnSelect: =Select(Parent)
            - btnTeam:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =If(ThisItem.Reportes = 0, "No direct reports", If(ThisItem.Id in colNiveles.Sel, "▾ Hide ", "▸ Show ") & ThisItem.Reportes & If(ThisItem.Reportes = 1, " report", " reports"))
                  Tooltip: ="Show or hide team"
                  X: =96
                  Y: =98
                  Width: =160
                  Height: =22
                  Fill: =Color.Transparent
                  HoverFill: =Color.Transparent
                  PressedFill: =Color.Transparent
                  Color: =If(ThisItem.Reportes = 0, ColorValue("#87878F"), ColorValue("#4A4A8A"))
                  HoverColor: =ColorValue("#202054")
                  PressedColor: =ColorValue("#202054")
                  BorderThickness: =0
                  Size: =9
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Left
                  PaddingLeft: =0
                  PaddingRight: =0
                  OnSelect: =Select(Parent)
            - btnProfile:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="i"
                  Tooltip: ="View profile"
                  X: =Parent.TemplateWidth - 46
                  Y: =24
                  Width: =26
                  Height: =26
                  Fill: =ColorValue("#EEEEF5")
                  HoverFill: =ColorValue("#202054")
                  PressedFill: =ColorValue("#4A4A8A")
                  Color: =ColorValue("#202054")
                  HoverColor: =Color.White
                  PressedColor: =Color.White
                  BorderColor: =ColorValue("#202054")
                  BorderThickness: =1
                  Size: =10
                  FontWeight: =FontWeight.Bold
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  RadiusTopLeft: =13
                  RadiusTopRight: =13
                  RadiusBottomLeft: =13
                  RadiusBottomRight: =13
                  OnSelect: =Set(varPersona, ThisItem); Set(varVerPanel, true)
- lblLoading:
