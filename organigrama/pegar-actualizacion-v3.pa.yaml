- lblEmail:
    Control: Label@2.5.1
    Properties:
      Text: ="✉  " & varPersona.Correo
      X: =Parent.Width - 370
      Y: =622
      Width: =340
      Height: =22
      Size: =11
      Color: =ColorValue("#202054")
      Wrap: =false
      Visible: =varVerPanel
- lblPhone:
    Control: Label@2.5.1
    Properties:
      Text: ="☎  " & varPersona.Tel
      X: =Parent.Width - 370
      Y: =644
      Width: =340
      Height: =22
      Size: =11
      Color: =ColorValue("#202054")
      Wrap: =false
      Visible: =varVerPanel && !IsBlank(varPersona.Tel)
- btnEmail:
