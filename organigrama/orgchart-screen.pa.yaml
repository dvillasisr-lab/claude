            - linStub:
                Control: Rectangle@2.3.0
                Properties:
                  X: =Parent.TemplateWidth / 2 - 1
                  Y: =0
                  Width: =2
                  Height: =7
                  Fill: =ColorValue("#87878F")
            - lblArrow:
                Control: Label@2.5.1
                Properties:
                  Text: ="▼"
                  X: =Parent.TemplateWidth / 2 - 6
                  Y: =0
                  Width: =12
                  Height: =10
                  Size: =6
                  Color: =ColorValue("#87878F")
                  Align: =Align.Center
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - btnCard:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  Tooltip: ="Click to show or hide this person's team"
