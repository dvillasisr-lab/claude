          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            Items: =Sort(Filter(colGente, Padre = ThisItem.Padre), Nombre)
            X: =Value(lblRowX.Text)
            Y: =26
            Width: =Value(lblRowW.Text)
            Height: =100
            TemplateSize: =230
            TemplatePadding: =0
            ShowScrollbar: =false
            ShowNavigation: =true
            Default: =LookUp(Filter(colGente, Padre = ThisItem.Padre), Id = ThisItem.Sel)
            OnSelect: |-
              =If(!varCargando,
                  Set(varCargando, true);
                  Set(varNivel, LookUp(colNiveles, Padre = ThisItem.Padre).Nivel);
                  RemoveIf(colNiveles, Nivel > varNivel);
                  If(
                      LookUp(colNiveles, Nivel = varNivel).Sel = ThisItem.Id,
                      Patch(colNiveles, LookUp(colNiveles, Nivel = varNivel), {Sel: ""}),
                      Patch(colNiveles, LookUp(colNiveles, Nivel = varNivel), {Sel: ThisItem.Id});
                      If(ThisItem.Reportes > 0,
                          If(IsEmpty(Filter(colGente, Padre = ThisItem.Id)),
                              Clear(colTmp); IfError(ClearCollect(colTmp, ForAll(Filter(UsuariosdeOffice365.DirectReportsV2(ThisItem.Id).value, accountEnabled <> false), {Padre: ThisItem.Id, Id: id, Nombre: displayName, Puesto: jobTitle, Depto: department, Correo: Lower(Coalesce(mail, userPrincipalName)), Tel: IfError(Coalesce(mobilePhone, First(businessPhones).Value), ""), Foto: IfError(UsuariosdeOffice365.UserPhotoMetadata(id).HasPhoto, false), Reportes: IfError(CountRows(Filter(UsuariosdeOffice365.DirectReportsV2(id).value, accountEnabled <> false)), 0)})), Notify("Could not load this team: " & FirstError.Message, NotificationType.Error));
                              Collect(colGente, colTmp)
                          );
                          Collect(colNiveles, {Nivel: varNivel + 1, Padre: ThisItem.Id, Sel: ""})
                      )
                  );
                  Set(varCargando, false)
              )
