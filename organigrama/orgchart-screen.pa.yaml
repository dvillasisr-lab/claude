      Width: =Parent.Width
      Height: =Parent.Height - 112
      TemplateSize: =140
      TemplatePadding: =0
      ShowScrollbar: =true
      Default: =Last(Sort(colNiveles, Nivel))
    Children:
      - lblRowW:
          Control: Label@2.5.1
          Properties:
            Text: =Min(CountRows(Filter(colGente, Padre = ThisItem.Padre)) * 230, Parent.TemplateWidth - 40)
            X: =0
            Y: =0
            Width: =10
            Height: =10
            Size: =8
            Color: =ColorValue("#87878F")
            Visible: =false
      - lblRowX:
          Control: Label@2.5.1
          Properties:
            Text: =(Parent.TemplateWidth - Min(CountRows(Filter(colGente, Padre = ThisItem.Padre)) * 230, Parent.TemplateWidth - 40)) / 2
            X: =0
            Y: =0
            Width: =10
            Height: =10
            Size: =8
            Color: =ColorValue("#87878F")
            Visible: =false
      - lblPX:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(ThisItem.Nivel = 1, Parent.TemplateWidth / 2, With({t: Sort(Filter(colGente, Padre = LookUp(colGente, Id = ThisItem.Padre).Padre), Nombre)}, With({w: Min(CountRows(t) * 230, Parent.TemplateWidth - 40)}, (Parent.TemplateWidth - w) / 2 + Min((Max(ForAll(Sequence(CountRows(t)), If(Index(t, Value).Id = ThisItem.Padre, Value)), Value) - 1) * 230, w - 230) + 115)))
            X: =0
            Y: =0
            Width: =10
            Height: =10
            Size: =8
            Color: =ColorValue("#87878F")
            Visible: =false
      - lblSelX:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With({t: Sort(Filter(colGente, Padre = ThisItem.Padre), Nombre)}, With({w: Min(CountRows(t) * 230, Parent.TemplateWidth - 40)}, (Parent.TemplateWidth - w) / 2 + Min((Max(ForAll(Sequence(CountRows(t)), If(Index(t, Value).Id = ThisItem.Sel, Value)), Value) - 1) * 230, w - 230) + 115))
            X: =0
            Y: =0
            Width: =10
            Height: =10
            Size: =8
            Color: =ColorValue("#87878F")
            Visible: =false
      - linUp:
          Control: Rectangle@2.3.0
          Properties:
            X: =Value(lblPX.Text) - 1
            Y: =0
            Width: =2
            Height: =27
            Fill: =ColorValue("#87878F")
            Visible: =ThisItem.Nivel > 1
      - linH:
          Control: Rectangle@2.3.0
          Properties:
            X: =Min(Value(lblPX.Text), Value(lblRowX.Text) + 115) - 1
            Y: =25
            Width: =Max(Value(lblPX.Text), Value(lblRowX.Text) + Value(lblRowW.Text) - 115) - Min(Value(lblPX.Text), Value(lblRowX.Text) + 115) + 2
            Height: =2
            Fill: =ColorValue("#87878F")
            Visible: =ThisItem.Nivel > 1
      - linDown:
          Control: Rectangle@2.3.0
          Properties:
            X: =Value(lblSelX.Text) - 1
            Y: =122
            Width: =2
            Height: =18
            Fill: =ColorValue("#87878F")
            Visible: =!IsBlank(ThisItem.Sel) && ThisItem.Nivel < Max(colNiveles, Nivel)
      - lblNivel:
          Control: Label@2.5.1
          Properties:
            Text: =If(ThisItem.Padre = "ROOT", "LEADERSHIP", Upper(LookUp(colGente, Id = ThisItem.Padre).Nombre) & "'S TEAM") & "  ·  " & CountRows(Filter(colGente, Padre = ThisItem.Padre))
