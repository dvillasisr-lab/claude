            - circAvatar:
                Control: Circle@2.3.0
                Properties:
                  X: =14
                  Y: =22
                  Width: =42
                  Height: =42
                  Fill: =Switch(ThisItem.Depto, "Executive", ColorValue("#202054"), "Finance", ColorValue("#4A4A8A"), "Human Resources", ColorValue("#87878F"), ColorValue("#4A4A8A"))
                  OnSelect: =Select(Parent)
            - lblInitials:
                Control: Label@2.5.1
                Properties:
                  Text: =Upper(Concat(FirstN(Split(ThisItem.Nombre, " "), 2), Left(Value, 1)))
