- galNiveles:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Items: =Sort(colNiveles, Nivel)
      X: =0
      Y: =112
      Width: =Parent.Width
      Height: =Parent.Height - 112
      TemplateSize: =172
      TemplatePadding: =0
      ShowScrollbar: =true
    Children:
      - lblNivel:
          Control: Label@2.5.1
          Properties:
            Text: =If(ThisItem.Padre = "ROOT", "LEADERSHIP", Upper(LookUp(colGente, Id = ThisItem.Padre).Nombre) & "'S TEAM") & "   ·   " & CountRows(Filter(colGente, Padre = ThisItem.Padre))
            X: =0
            Y: =6
            Width: =Parent.TemplateWidth
            Height: =24
            Size: =10
            Color: =ColorValue("#87878F")
            Align: =Align.Center
            FontWeight: =FontWeight.Semibold
      - galPersonas:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            Items: =Sort(Filter(colGente, Padre = ThisItem.Padre), Nombre)
            X: =(Parent.TemplateWidth - Self.Width) / 2
            Y: =34
            Width: =Min(CountRows(Filter(colGente, Padre = ThisItem.Padre)) * 300, Parent.TemplateWidth - 40)
            Height: =132
            TemplateSize: =300
            TemplatePadding: =0
            ShowScrollbar: =false
            ShowNavigation: =true
            OnSelect: |-
              =Set(varNivel, LookUp(colNiveles, Padre = ThisItem.Padre).Nivel);
              RemoveIf(colNiveles, Nivel > varNivel);
              If(
                  LookUp(colNiveles, Nivel = varNivel).Sel = ThisItem.Id,
                  Patch(colNiveles, LookUp(colNiveles, Nivel = varNivel), {Sel: ""}),
                  Patch(colNiveles, LookUp(colNiveles, Nivel = varNivel), {Sel: ThisItem.Id});
                  If(ThisItem.Reportes > 0,
                      If(IsEmpty(Filter(colGente, Padre = ThisItem.Id)),
                          Collect(colGente, ForAll(Filter(UsuariosdeOffice365.DirectReportsV2(ThisItem.Id).value, !IsBlank(mail)), {Padre: ThisItem.Id, Id: id, Nombre: displayName, Puesto: jobTitle, Depto: department, Correo: Lower(mail), Tel: Coalesce(mobilePhone, First(businessPhones).Value), Foto: UsuariosdeOffice365.UserPhotoMetadata(id).HasPhoto, Reportes: CountRows(UsuariosdeOffice365.DirectReportsV2(id).value)}))
                      );
                      Collect(colNiveles, {Nivel: varNivel + 1, Padre: ThisItem.Id, Sel: ""})
                  )
              )
          Children:
            - btnCard:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  Tooltip: ="Click to show or hide this person's team"
                  X: =6
                  Y: =4
                  Width: =Parent.TemplateWidth - 12
                  Height: =122
                  Fill: =If(ThisItem.Id in colNiveles.Sel, ColorValue("#EEEEF5"), Color.White)
                  HoverFill: =ColorValue("#EEEEF5")
                  PressedFill: =ColorValue("#E2E2EE")
                  BorderColor: =If(ThisItem.Id in colNiveles.Sel, ColorValue("#202054"), ColorValue("#E3E3E3"))
                  HoverBorderColor: =ColorValue("#202054")
                  BorderThickness: =If(ThisItem.Id in colNiveles.Sel, 2, 1)
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  OnSelect: =Select(Parent)
            - circAvatar:
                Control: Circle@2.3.0
                Properties:
                  X: =22
                  Y: =22
                  Width: =60
                  Height: =60
                  Fill: =Switch(ThisItem.Depto, "Executive", ColorValue("#202054"), "Finance", ColorValue("#4A4A8A"), "Human Resources", ColorValue("#87878F"), ColorValue("#4A4A8A"))
                  OnSelect: =Select(Parent)
            - lblInitials:
                Control: Label@2.5.1
                Properties:
                  Text: =Upper(Concat(FirstN(Split(ThisItem.Nombre, " "), 2), Left(Value, 1)))
                  X: =22
                  Y: =22
                  Width: =60
                  Height: =60
                  Size: =18
                  Color: =Color.White
                  Align: =Align.Center
                  FontWeight: =FontWeight.Bold
                  OnSelect: =Select(Parent)
            - imgPhoto:
                Control: Image@2.2.3
                Properties:
                  Image: =If(ThisItem.Foto, UsuariosdeOffice365.UserPhotoV2(ThisItem.Id))
                  X: =22
                  Y: =22
                  Width: =60
                  Height: =60
                  ImagePosition: =ImagePosition.Fill
                  RadiusTopLeft: =30
                  RadiusTopRight: =30
                  RadiusBottomLeft: =30
                  RadiusBottomRight: =30
                  Visible: =ThisItem.Foto
                  OnSelect: =Select(Parent)
            - lblName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Nombre
                  X: =96
                  Y: =18
                  Width: =Parent.TemplateWidth - 110
                  Height: =26
                  Size: =14
                  Color: =ColorValue("#202054")
                  FontWeight: =FontWeight.Bold
                  Wrap: =false
                  OnSelect: =Select(Parent)
            - lblJobTitle:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Puesto
                  X: =96
                  Y: =44
                  Width: =Parent.TemplateWidth - 110
                  Height: =20
                  Size: =11
                  Color: =ColorValue("#565656")
                  Wrap: =false
                  OnSelect: =Select(Parent)
            - lblDept:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Depto
                  X: =96
                  Y: =62
                  Width: =Parent.TemplateWidth - 110
                  Height: =18
                  Size: =10
                  Color: =ColorValue("#87878F")
                  Wrap: =false
                  OnSelect: =Select(Parent)
            - btnTeam:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =If(ThisItem.Reportes = 0, "No reports", If(ThisItem.Id in colNiveles.Sel, "▾ ", "▸ ") & ThisItem.Reportes & If(ThisItem.Reportes = 1, " report", " reports"))
                  Tooltip: ="Show or hide team"
                  X: =96
                  Y: =86
                  Width: =108
                  Height: =28
                  Fill: =ColorValue("#EEEEF5")
                  HoverFill: =ColorValue("#E2E2EE")
                  PressedFill: =ColorValue("#D6D6E6")
                  Color: =If(ThisItem.Reportes = 0, ColorValue("#87878F"), ColorValue("#202054"))
                  BorderThickness: =0
                  Size: =10
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  OnSelect: =Select(Parent)
            - btnProfile:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Profile ›"
                  Tooltip: ="See job description, scope, start date, location and backup"
                  X: =210
                  Y: =86
                  Width: =78
                  Height: =28
                  Fill: =ColorValue("#202054")
                  HoverFill: =ColorValue("#4A4A8A")
                  PressedFill: =ColorValue("#4A4A8A")
                  Color: =Color.White
                  HoverColor: =Color.White
                  BorderThickness: =0
                  Size: =10
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  OnSelect: =Set(varPersona, ThisItem); Set(varVerPanel, true)
- galBuscar:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Items: |-
        =If(Len(txtBuscar.Text) >= 2, UsuariosdeOffice365.SearchUserV2({searchTerm: txtBuscar.Text, top: 6}).value)
      X: =txtBuscar.X
      Y: =56
      Width: =296
      Height: =288
      TemplateSize: =48
      TemplatePadding: =0
      Fill: =Color.White
      BorderColor: =ColorValue("#E3E3E3")
      BorderThickness: =1
      Visible: =Len(txtBuscar.Text) >= 2
      OnSelect: |-
        =With({b: UsuariosdeOffice365.UserProfileV2(ThisItem.Id)}, Set(varPersona, {Padre: "", Id: b.id, Nombre: b.displayName, Puesto: b.jobTitle, Depto: b.department, Correo: Lower(b.mail), Tel: Coalesce(b.mobilePhone, First(b.businessPhones).Value), Foto: UsuariosdeOffice365.UserPhotoMetadata(b.id).HasPhoto, Reportes: CountRows(UsuariosdeOffice365.DirectReportsV2(b.id).value)})); Set(varVerPanel, true); Reset(txtBuscar)
    Children:
      - lblSearchItem:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.DisplayName & "  ·  " & ThisItem.JobTitle
            X: =14
            Y: =0
            Width: =Parent.TemplateWidth - 28
