- galNiveles:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Items: =Sort(colNiveles, Nivel)
      X: =0
      Y: =112
      Width: =Parent.Width
      Height: =Parent.Height - 112
      TemplateSize: =172
      TemplatePadding: =0
      ShowScrollbar: =true
    Children:
      - lblNivel:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(ThisItem.Padre = "ROOT", "LEADERSHIP", Upper(LookUp(colPersonas, Correo = ThisItem.Padre).Title) & "'S TEAM") & "   ·   " & CountRows(Filter(colPersonas, If(IsBlank(CorreoJefe), "ROOT", CorreoJefe) = ThisItem.Padre))
            X: =0
            Y: =6
            Width: =Parent.TemplateWidth
            Height: =24
            Align: =Align.Center
            Size: =10
            FontWeight: =FontWeight.Semibold
            Color: =ColorValue("#87878F")
      - galPersonas:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            Items: |-
              =Sort(Filter(colPersonas, If(IsBlank(CorreoJefe), "ROOT", CorreoJefe) = ThisItem.Padre), Title)
            X: =(Parent.TemplateWidth - Self.Width) / 2
            Y: =34
            Width: |-
              =Min(CountRows(Filter(colPersonas, If(IsBlank(CorreoJefe), "ROOT", CorreoJefe) = ThisItem.Padre)) * 300, Parent.TemplateWidth - 40)
            Height: =132
            TemplateSize: =300
            TemplatePadding: =0
            ShowScrollbar: =false
            ShowNavigation: =true
            OnSelect: |-
              =Set(varNivel, LookUp(colNiveles, Padre = If(IsBlank(ThisItem.CorreoJefe), "ROOT", ThisItem.CorreoJefe)).Nivel);
              RemoveIf(colNiveles, Nivel > varNivel);
              If(
                  LookUp(colNiveles, Nivel = varNivel).Sel = ThisItem.Correo,
                  Patch(colNiveles, LookUp(colNiveles, Nivel = varNivel), {Sel: ""}),
                  Patch(colNiveles, LookUp(colNiveles, Nivel = varNivel), {Sel: ThisItem.Correo});
                  If(CountRows(Filter(colPersonas, CorreoJefe = ThisItem.Correo)) > 0, Collect(colNiveles, {Nivel: varNivel + 1, Padre: ThisItem.Correo, Sel: ""}))
              )
          Children:
            - btnCard:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  Tooltip: ="Click to show or hide this person's team"
                  X: =6
                  Y: =4
                  Width: =Parent.TemplateWidth - 12
                  Height: =122
                  Fill: =If(ThisItem.Correo in colNiveles.Sel, ColorValue("#EEEEF5"), Color.White)
                  HoverFill: =ColorValue("#EEEEF5")
                  PressedFill: =ColorValue("#E2E2EE")
                  BorderColor: =If(ThisItem.Correo in colNiveles.Sel, ColorValue("#202054"), ColorValue("#E3E3E3"))
                  HoverBorderColor: =ColorValue("#202054")
                  BorderThickness: =If(ThisItem.Correo in colNiveles.Sel, 2, 1)
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  OnSelect: =Select(Parent)
            - circAvatar:
                Control: Circle@2.3.0
                Properties:
                  X: =22
                  Y: =22
                  Width: =60
                  Height: =60
                  Fill: |-
                    =Switch(ThisItem.Area, "Executive", ColorValue("#202054"), "Dirección", ColorValue("#202054"), "Finance", ColorValue("#4A4A8A"), "Finanzas", ColorValue("#4A4A8A"), "Human Resources", ColorValue("#87878F"), "Recursos Humanos", ColorValue("#87878F"), ColorValue("#616066"))
                  OnSelect: =Select(Parent)
            - lblInitials:
                Control: Label@2.5.1
                Properties:
                  Text: =Upper(Concat(FirstN(Split(ThisItem.Title, " "), 2), Left(Value, 1)))
                  X: =22
                  Y: =22
                  Width: =60
                  Height: =60
                  Align: =Align.Center
                  Color: =Color.White
                  Size: =18
                  FontWeight: =FontWeight.Bold
                  OnSelect: =Select(Parent)
            - lblName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Title
                  X: =96
                  Y: =20
                  Width: =Parent.TemplateWidth - 110
                  Height: =26
                  Size: =14
                  FontWeight: =FontWeight.Bold
                  Color: =ColorValue("#202054")
                  Wrap: =false
                  OnSelect: =Select(Parent)
            - lblJobTitle:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Puesto
                  X: =96
                  Y: =46
                  Width: =Parent.TemplateWidth - 110
                  Height: =22
                  Size: =11
                  Color: =ColorValue("#565656")
                  Wrap: =false
                  OnSelect: =Select(Parent)
            - btnTeam:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    =With({n: CountRows(Filter(colPersonas, CorreoJefe = ThisItem.Correo))}, If(n = 0, "No reports", If(ThisItem.Correo in colNiveles.Sel, "▾ ", "▸ ") & n & If(n = 1, " report", " reports")))
                  Tooltip: ="Show or hide team"
                  X: =96
                  Y: =82
                  Width: =108
                  Height: =28
                  Fill: =ColorValue("#EEEEF5")
                  HoverFill: =ColorValue("#E2E2EE")
                  PressedFill: =ColorValue("#D6D6E6")
                  Color: |-
                    =If(CountRows(Filter(colPersonas, CorreoJefe = ThisItem.Correo)) = 0, ColorValue("#87878F"), ColorValue("#202054"))
                  BorderThickness: =0
                  Size: =10
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  OnSelect: =Select(Parent)
            - btnProfile:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="Profile ›"
                  Tooltip: ="See profile, job description and location"
                  X: =210
                  Y: =82
                  Width: =78
                  Height: =28
                  Fill: =ColorValue("#202054")
                  HoverFill: =ColorValue("#4A4A8A")
                  PressedFill: =ColorValue("#4A4A8A")
                  Color: =Color.White
                  HoverColor: =Color.White
                  BorderThickness: =0
                  Size: =10
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  OnSelect: =Set(varPersona, ThisItem); Set(varVerPanel, true)
- galBuscar:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Items: =Filter(colPersonas, txtBuscar.Text in Title || txtBuscar.Text in Puesto)
      X: =txtBuscar.X
      Y: =56
      Width: =296
      Height: =Min(CountRows(Filter(colPersonas, txtBuscar.Text in Title || txtBuscar.Text in Puesto)) * 48, 288)
      TemplateSize: =48
      TemplatePadding: =0
      Fill: =Color.White
      BorderColor: =ColorValue("#E3E3E3")
      BorderThickness: =1
      Visible: =!IsBlank(txtBuscar.Text)
      OnSelect: =Set(varPersona, ThisItem); Set(varVerPanel, true); Reset(txtBuscar)
    Children:
      - lblSearchItem:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.Title & "  ·  " & ThisItem.Puesto
            X: =14
            Y: =0
            Width: =Parent.TemplateWidth - 28
