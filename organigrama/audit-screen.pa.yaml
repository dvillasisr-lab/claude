- btnRunA:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =If(varAuditando, "Running...", "Run audit")
      X: =Parent.Width - 560
      Y: =14
      Width: =150
      Height: =36
      Size: =11
      Fill: =Color.White
      HoverFill: =ColorValue("#EEEEF5")
      Color: =ColorValue("#202054")
      FontWeight: =FontWeight.Semibold
      BorderThickness: =0
      RadiusTopLeft: =18
      RadiusTopRight: =18
      RadiusBottomLeft: =18
      RadiusBottomRight: =18
      DisplayMode: =If(varAuditando, DisplayMode.Disabled, DisplayMode.Edit)
      OnSelect: |-
        =Set(varAuditando, true);
        Set(varFiltroA, "All");
        Set(varVerA, false);
        Set(varVistaA, "accounts");
        ClearCollect(colAudU, UsuariosdeOffice365.SearchUserV2({isSearchTermRequired: false, top: 999}).value);
        ClearCollect(colAudit,
          ForAll(colAudU As u,
            With({m: IfError(UsuariosdeOffice365.ManagerV2(u.Id, {'$select': "id,displayName,mail"}), Blank())},
              {Id: u.Id, DisplayName: u.DisplayName, GivenName: u.GivenName, Surname: u.Surname, Mail: u.Mail, UserPrincipalName: u.UserPrincipalName, MailNickname: u.MailNickname, AccountEnabled: u.AccountEnabled, Department: u.Department, JobTitle: u.JobTitle, CompanyName: u.CompanyName, OfficeLocation: u.OfficeLocation, City: u.City, Country: u.Country, MobilePhone: u.MobilePhone,
               Manager: m.displayName, ManagerMail: m.mail, ManagerEnabled: LookUp(colAudU, Id = m.id).AccountEnabled,
               Dup: CountIf(colAudU, Lower(Trim(DisplayName)) = Lower(Trim(u.DisplayName))) > 1,
               Guest: "#EXT#" in u.UserPrincipalName})));
        ClearCollect(colAudF, {T: "All", N: CountIf(colAudit, true)}, {T: "AccountEnabled = true", N: CountIf(colAudit, AccountEnabled)}, {T: "AccountEnabled = false", N: CountIf(colAudit, !AccountEnabled)}, {T: "Manager = blank", N: CountIf(colAudit, AccountEnabled && IsBlank(Manager))}, {T: "Manager is blocked", N: CountIf(colAudit, AccountEnabled && !IsBlank(Manager) && ManagerEnabled = false)}, {T: "Department = blank", N: CountIf(colAudit, AccountEnabled && IsBlank(Department))}, {T: "JobTitle = blank", N: CountIf(colAudit, AccountEnabled && IsBlank(JobTitle))}, {T: "CompanyName = blank", N: CountIf(colAudit, AccountEnabled && IsBlank(CompanyName))}, {T: "OfficeLocation = blank", N: CountIf(colAudit, AccountEnabled && IsBlank(OfficeLocation))}, {T: "GivenName + Surname = blank", N: CountIf(colAudit, AccountEnabled && IsBlank(GivenName) && IsBlank(Surname))}, {T: "Same DisplayName twice", N: CountIf(colAudit, Dup)}, {T: "Guest (#EXT#)", N: CountIf(colAudit, Guest)});
        Set(varAuditando, false)
