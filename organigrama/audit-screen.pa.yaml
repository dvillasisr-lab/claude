- btnMailA:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="✉ Email report to me"
      X: =Parent.Width - 220
      Y: =14
      Width: =200
      Height: =36
      Size: =11
      Fill: =ColorValue("#3B3B8F")
      HoverFill: =ColorValue("#4C5C99")
      Color: =Color.White
      FontWeight: =FontWeight.Semibold
      BorderThickness: =0
      RadiusTopLeft: =18
      RadiusTopRight: =18
      RadiusBottomLeft: =18
      RadiusBottomRight: =18
      DisplayMode: =If(varAuditando || IsEmpty(colAudit), DisplayMode.Disabled, DisplayMode.Edit)
      OnSelect: |-
        =Office365Outlook.SendEmailV2(
          User().Email,
          "Entra ID account audit: " & CountRows(colAudit) & " accounts",
          "<div style='font-family:Arial;font-size:13px;color:#202054'>" &
          "<h2>Entra ID account audit</h2>" &
          "<p>Generated " & Text(Now(), "mmm d, yyyy h:mm AM/PM", "en-US") & ". Raw values read directly from Microsoft 365, nothing typed by hand.<br>" &
          "Source: <code>UsuariosdeOffice365.SearchUserV2({isSearchTermRequired: false, top: 999}).value</code> and <code>UsuariosdeOffice365.ManagerV2(Id)</code></p>" &
          "<h3>1. Summary</h3><table border='1' cellpadding='5' style='border-collapse:collapse;font-size:12px'><tr style='background:#EEEEF5'><th align='left'>Check (active accounts unless noted)</th><th>Accounts</th></tr>" &
          "<tr><td>All</td><td align='center'>" & CountIf(colAudit, true) & "</td></tr>" & "<tr><td>AccountEnabled = true</td><td align='center'>" & CountIf(colAudit, AccountEnabled) & "</td></tr>" & "<tr><td>AccountEnabled = false</td><td align='center'>" & CountIf(colAudit, !AccountEnabled) & "</td></tr>" & "<tr><td>Manager = blank</td><td align='center'>" & CountIf(colAudit, AccountEnabled && IsBlank(Manager)) & "</td></tr>" & "<tr><td>Manager is blocked</td><td align='center'>" & CountIf(colAudit, AccountEnabled && !IsBlank(Manager) && ManagerEnabled = false) & "</td></tr>" & "<tr><td>Department = blank</td><td align='center'>" & CountIf(colAudit, AccountEnabled && IsBlank(Department)) & "</td></tr>" & "<tr><td>JobTitle = blank</td><td align='center'>" & CountIf(colAudit, AccountEnabled && IsBlank(JobTitle)) & "</td></tr>" & "<tr><td>CompanyName = blank</td><td align='center'>" & CountIf(colAudit, AccountEnabled && IsBlank(CompanyName)) & "</td></tr>" & "<tr><td>OfficeLocation = blank</td><td align='center'>" & CountIf(colAudit, AccountEnabled && IsBlank(OfficeLocation)) & "</td></tr>" & "<tr><td>GivenName + Surname = blank</td><td align='center'>" & CountIf(colAudit, AccountEnabled && IsBlank(GivenName) && IsBlank(Surname)) & "</td></tr>" & "<tr><td>Same DisplayName twice</td><td align='center'>" & CountIf(colAudit, Dup) & "</td></tr>" & "<tr><td>Guest (#EXT#)</td><td align='center'>" & CountIf(colAudit, Guest) & "</td></tr>" &
          "</table>" &
          "<h3>2. Values in use (active accounts). Each line is a different spelling in Entra ID; variants should be standardized.</h3><table><tr>" &
          "<td valign='top'><b>Department</b><table border='1' cellpadding='4' style='border-collapse:collapse;font-size:11px;margin-right:16px'>" & Concat(Sort(ForAll(Distinct(Filter(colAudit, AccountEnabled), Coalesce(Department, "(blank)")) As d, {V: d.Value, K: CountIf(colAudit, AccountEnabled && Coalesce(Department, "(blank)") = d.Value)}), V), "<tr><td>" & V & "</td><td align='center'>" & K & "</td></tr>") & "</table></td>" & "<td valign='top'><b>CompanyName</b><table border='1' cellpadding='4' style='border-collapse:collapse;font-size:11px;margin-right:16px'>" & Concat(Sort(ForAll(Distinct(Filter(colAudit, AccountEnabled), Coalesce(CompanyName, "(blank)")) As d, {V: d.Value, K: CountIf(colAudit, AccountEnabled && Coalesce(CompanyName, "(blank)") = d.Value)}), V), "<tr><td>" & V & "</td><td align='center'>" & K & "</td></tr>") & "</table></td>" & "<td valign='top'><b>OfficeLocation</b><table border='1' cellpadding='4' style='border-collapse:collapse;font-size:11px;margin-right:16px'>" & Concat(Sort(ForAll(Distinct(Filter(colAudit, AccountEnabled), Coalesce(OfficeLocation, "(blank)")) As d, {V: d.Value, K: CountIf(colAudit, AccountEnabled && Coalesce(OfficeLocation, "(blank)") = d.Value)}), V), "<tr><td>" & V & "</td><td align='center'>" & K & "</td></tr>") & "</table></td>" &
          "</tr></table>" &
          "<h3>3. Every account</h3><table border='1' cellpadding='4' style='border-collapse:collapse;font-size:11px'><tr style='background:#EEEEF5'><th align='left'>DisplayName</th><th align='left'>Mail / UserPrincipalName</th><th align='left'>AccountEnabled</th><th align='left'>Department</th><th align='left'>JobTitle</th><th align='left'>CompanyName</th><th align='left'>OfficeLocation</th><th align='left'>Manager</th></tr>" &
          Concat(Sort(colAudit, DisplayName), "<tr>" & "<td>" & DisplayName & "</td>" & "<td>" & Coalesce(Mail, UserPrincipalName) & "</td>" & "<td style='color:" & If(AccountEnabled, "#1E7B34", "#B3261E") & "'>" & If(AccountEnabled, "true", "false") & "</td>" & "<td>" & Coalesce(Department, "(blank)") & "</td>" & "<td>" & Coalesce(JobTitle, "(blank)") & "</td>" & "<td>" & Coalesce(CompanyName, "(blank)") & "</td>" & "<td>" & Coalesce(OfficeLocation, "(blank)") & "</td>" & "<td>" & Coalesce(Manager, "(blank)") & If(ManagerEnabled = false && !IsBlank(Manager), " (blocked)", "") & "</td>" & "</tr>") &
          "</table></div>",
          {Importance: "Normal"});
        Notify("Report sent to " & User().Email, NotificationType.Success)
