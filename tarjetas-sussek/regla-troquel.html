<!doctype html>
<html lang="en">

<meta charset="utf-8">
<title>Sussek · regla-troquel</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Open+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<style>
  @page { size: 95mm 57mm; margin: 0; }
  :root{
    --navy:#202054; --navy-deep:#15153a; --line:#cdd5ee; --soft:#aab0d8; --ink:#1d1d22; --muted:#6b6f95; --glow:#f39a2b;
    --steel:linear-gradient(90deg,#8e949b,#e9ecef 30%,#a9afb5 55%,#f4f6f7 75%,#8e949b);
    --m:8.5mm; --paper:#f5f3ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d9dce1}
  body{font-family:"Open Sans",Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{width:95mm;height:57mm;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .draw{position:absolute;inset:0;width:95mm;height:57mm}
  .dim{font-family:"IBM Plex Mono",monospace;font-size:1.45px;letter-spacing:.03px;fill:currentColor}
  .abs{position:absolute}
  .serif{font-family:"EB Garamond",Garamond,Georgia,serif}

  .lockup{display:flex;align-items:center;gap:3mm}
  .lockup img{height:12.5mm;width:auto;display:block}
  .word{font-family:"EB Garamond",Garamond,Georgia,serif;font-weight:500;font-size:4.6mm;line-height:1.02}
  .word span{display:block}
  .word span::first-letter{font-size:1.16em;font-weight:600}

  .who h1{font-family:"EB Garamond",Garamond,Georgia,serif;font-weight:500;font-size:4.8mm;line-height:1.05}
  .who p{font-size:1.65mm;font-weight:700;letter-spacing:.24mm;text-transform:uppercase;margin-top:1.6mm}
  .data{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:2.4mm;row-gap:.9mm;font-size:1.9mm;line-height:1.3}
  .data dt{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:1.5mm}
  .eyebrow{font-size:1.6mm;font-weight:700;letter-spacing:.2mm;text-transform:uppercase}

  @media screen{
    body{display:flex;flex-wrap:wrap;gap:10mm;padding:12mm;justify-content:center}
    .card{box-shadow:0 2mm 6mm rgba(0,0,0,.22)}
  }

  .dim.b{font-weight:600}
  .lab{font-family:"IBM Plex Mono",monospace;font-size:1.4px;font-weight:600;letter-spacing:.06px;fill:currentColor}
  .note{font-family:"EB Garamond",Garamond,Georgia,serif;font-style:italic;font-size:2.3px;fill:currentColor}
  .mail{font-family:"IBM Plex Mono",monospace;font-size:3.6px;font-weight:500;fill:#1d1d22}

  .rgt.front{background:radial-gradient(110% 130% at 70% 45%,#2a2a6e 0%,var(--navy) 45%,var(--navy-deep) 100%);color:#fff}
  .rgt.front .draw{color:var(--line)}
  .rgt.front .lockup-wrap{left:var(--m);top:19mm}
  .rgt.front .lockup img{height:12mm}
  .rgt.front .word{font-size:4.4mm}
  .rgt.front .pitch{right:var(--m);top:21mm;text-align:right}
  .rgt .pitch h2{font-family:"EB Garamond",Garamond,Georgia,serif;font-weight:500;font-size:5.4mm;line-height:1.02}
  .rgt .pitch p{margin-top:2mm;font-family:"IBM Plex Mono",monospace;font-size:1.45mm;letter-spacing:.1mm;color:var(--soft)}
  .rgt.back{background:#fff;color:var(--navy)}
  .rgt.back .draw{color:var(--navy)}
  .rgt.back .who{left:var(--m);top:var(--m)}
  .rgt.back .who p{color:var(--muted)}
  .rgt.back .data{left:var(--m);top:22.5mm;color:var(--ink)}
  .rgt.back .data dt{color:var(--navy)}
  .rgt.back .plain{display:block;font-size:1.95mm;line-height:1.75}
  .rgt.back .foot{left:var(--m);right:var(--m);bottom:var(--m);display:flex;align-items:center;gap:2.6mm}
  .rgt.back .foot img{height:5.8mm;display:block}
  .rgt.back .block{flex:1;height:5.4mm;display:grid;grid-template-columns:1fr 1fr 1fr auto;border:.25mm solid var(--navy);font-size:1.45mm;font-weight:700;letter-spacing:.2mm;text-transform:uppercase}
  .rgt.back .block>*{display:flex;align-items:center;justify-content:center;padding:0 1.8mm;border-left:.18mm solid var(--navy)}
  .rgt.back .block>:first-child{border-left:0}
  .rgt.back .block .geo{background:var(--navy);color:#fff}
  .dieline{background:#fff}
  @media screen{
    .rgt.front{clip-path:path('M30.236,11.339 H342.047 A5.669,5.669 0 0 1 347.717,17.008 V194.646 A9.449,9.449 0 0 0 338.268,204.094 H17.008 A5.669,5.669 0 0 1 11.339,198.425 V30.236 A18.898,18.898 0 0 1 30.236,11.339 Z')}
    .rgt.back{clip-path:path('M328.819,11.339 H17.008 A5.669,5.669 0 0 0 11.339,17.008 V194.646 A9.449,9.449 0 0 1 20.787,204.094 H342.047 A5.669,5.669 0 0 0 347.717,198.425 V30.236 A18.898,18.898 0 0 0 328.819,11.339 Z')}
    .dieline{display:none}
  }
</style>
</head>
