<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sussek · regla-color-grafito</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Open+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<style>
  @page { size: 95mm 57mm; margin: 0; }
  :root{
    --navy:#202054; --navy-deep:#15153a; --line:#cdd5ee; --soft:#aab0d8; --ink:#1d1d22; --muted:#6b6f95; --glow:#f39a2b;
    --steel:linear-gradient(90deg,#8e949b,#e9ecef 30%,#a9afb5 55%,#f4f6f7 75%,#8e949b);
    --m:8.5mm; --paper:#f5f3ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d9dce1}
  body{font-family:"Open Sans",Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{width:95mm;height:57mm;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .draw{position:absolute;inset:0;width:95mm;height:57mm}
  .dim{font-family:"IBM Plex Mono",monospace;font-size:1.45px;letter-spacing:.03px;fill:currentColor}
  .abs{position:absolute}
  .serif{font-family:"EB Garamond",Garamond,Georgia,serif}

  .lockup{--ih:12.5mm;display:flex;align-items:flex-start}
  .lockup img{height:var(--ih);width:auto;display:block}
  .lockup .wm{height:calc(var(--ih) * .987);width:auto;margin:calc(var(--ih) * .033) 0 0 calc(var(--ih) * .099);display:block;overflow:visible}
  .wm .ini{fill:var(--ini, currentColor)}
  .wm .rest{fill:var(--rest, currentColor)}
  .c1.front .wm, .d2.back .wm, .d3.front .wm{--ini:#202054;--rest:#26262b}
  .word{font-family:"EB Garamond",Garamond,Georgia,serif;font-weight:500;font-size:4.6mm;line-height:1.02}
  .word span{display:block}
  .word span::first-letter{font-size:1.16em;font-weight:600}

  .who h1{font-family:"EB Garamond",Garamond,Georgia,serif;font-weight:500;font-size:4.8mm;line-height:1.05}
  .who p{font-size:1.65mm;font-weight:700;letter-spacing:.24mm;text-transform:uppercase;margin-top:1.6mm}
  .data{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:2.4mm;row-gap:.9mm;font-size:1.9mm;line-height:1.3}
  .data dt{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:1.5mm}
  .eyebrow{font-size:1.6mm;font-weight:700;letter-spacing:.2mm;text-transform:uppercase}

  @media screen{
    body{display:flex;flex-wrap:wrap;gap:10mm;padding:12mm;justify-content:center}
    .card{box-shadow:0 2mm 6mm rgba(0,0,0,.22)}
  }

  .dim.b{font-weight:600}
  .lab{font-family:"IBM Plex Mono",monospace;font-size:1.4px;font-weight:600;letter-spacing:.06px;fill:currentColor}
  .note{font-family:"EB Garamond",Garamond,Georgia,serif;font-style:italic;font-size:2.3px;fill:currentColor}
  .mail{font-family:"IBM Plex Mono",monospace;font-size:3.6px;font-weight:500;fill:#1d1d22}

  .rgcgrafito.front{background:radial-gradient(110% 130% at 70% 45%,#34363b 0%,#1f1f1f 50%,#141416 100%);color:#fff}
  .rgcgrafito.front .draw{color:#c9ccd1}
  .rgcgrafito.front .wm{--ini:#fff;--rest:#fff}
  .rgcgrafito.front .lockup-wrap{left:var(--m);top:19.5mm}
  .rgcgrafito.front .lockup{--ih:13.5mm}
  .rgcgrafito.front .word{font-size:4.4mm}
  .rgcgrafito.front .pitch{right:var(--m);top:17.5mm;text-align:right}
  .rgcgrafito .pitch h2{font-family:"EB Garamond",Garamond,Georgia,serif;font-weight:500;font-size:5.4mm;line-height:1.02}
  .rgcgrafito .pitch p{margin-top:2mm;font-family:"IBM Plex Mono",monospace;font-size:1.45mm;letter-spacing:.1mm;color:#9a9ea6}
  .rgcgrafito.back{background:#fff;color:#202054}
  .rgcgrafito.back .draw{color:#1f1f1f}
  .rgcgrafito.back .who{left:var(--m);top:var(--m)}
  .rgcgrafito.back .who p{color:#6d7078}
  .rgcgrafito.back .data{left:var(--m);top:22.5mm;color:#1f1f1f}
  .rgcgrafito.back .data dt{color:var(--navy)}
  .rgcgrafito.back .plain{display:block;font-size:1.95mm;line-height:1.75}
  .rgcgrafito.back .foot{left:var(--m);right:var(--m);bottom:var(--m);display:flex;align-items:center;gap:2.4mm;font-size:1.45mm;font-weight:700;letter-spacing:.22mm;text-transform:uppercase}
  .rgcgrafito.back .foot img{height:4.6mm;display:block}
  .rgcgrafito.back .foot .svc{flex:1;color:#202054}
  .rgcgrafito.back .foot .geo{color:#6d7078}
  .dieline{background:#fff}

  @page { size: 95.25mm 57.15mm; margin: 0; }
  .card{width:95.25mm;height:57.15mm}
  .draw{width:95.25mm;height:57.15mm}
  @media screen{ .card{clip-path:inset(3.175mm round .4mm)} }
</style>
</head>
