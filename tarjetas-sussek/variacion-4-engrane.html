<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sussek Machine Company · Tarjetas</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Open+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Tarjeta final 89 x 51 mm + 3 mm de sangrado por lado = 95 x 57 mm */
  @page { size: 95mm 57mm; margin: 0; }
  :root{
    --navy:#202054; --navy-deep:#17173f; --line:#c9d2ea; --ink:#1f1f1f; --gray:#565656;
    --steel:linear-gradient(90deg,#8e949b,#e9ecef 30%,#a9afb5 55%,#f4f6f7 75%,#8e949b);
    --bleed:3mm; --safe:5mm;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d9dce1}
  body{font-family:"Open Sans",Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{width:95mm;height:57mm;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .draw{position:absolute;inset:0;width:95mm;height:57mm}
  .dim{font-family:"IBM Plex Mono",monospace;font-size:1.55px;letter-spacing:.05px;fill:currentColor}

  /* FRENTE: plano técnico sobre azul marino */
  .front{background:radial-gradient(120% 140% at 80% 45%,#28286a 0%,var(--navy) 45%,var(--navy-deep) 100%);color:#fff}
  .front .grid{position:absolute;inset:0;opacity:.09;
    background-image:linear-gradient(#fff .12mm,transparent .12mm),linear-gradient(90deg,#fff .12mm,transparent .12mm);
    background-size:4mm 4mm;background-position:1mm 1.5mm}
  .front .draw{color:var(--line)}
  .front .lockup{position:absolute;left:calc(var(--bleed) + var(--safe));top:50%;transform:translateY(-58%);display:flex;align-items:center;gap:2.6mm}
  .lockup img{height:11.5mm;width:auto;display:block}
  .word{font-family:"EB Garamond",Garamond,Georgia,serif;font-weight:500;font-size:4.6mm;line-height:.98;letter-spacing:.05mm}
  .word span{display:block}
  .word span::first-letter{font-size:1.18em;font-weight:600}
  .front .caps{position:absolute;left:calc(var(--bleed) + var(--safe));bottom:calc(var(--bleed) + 4.6mm);
    font-size:1.75mm;font-weight:700;letter-spacing:.38mm;text-transform:uppercase;line-height:1.55}
  .front .caps i{display:block;width:10mm;height:.55mm;background:var(--steel);margin-bottom:1.6mm}
  .front .caps span{color:#b9bede;font-weight:600}

  /* REVERSO: blanco con corte de eje y cuadro de rótulo */
  .back{background:#fff;color:var(--navy)}
  .back .draw{color:var(--navy);opacity:.6}
  .back .dim{font-size:2.1px}
  .back .inner{position:absolute;inset:calc(var(--bleed) + 4.6mm) calc(var(--bleed) + 4.6mm) calc(var(--bleed) + 4mm)}
  .who h1{font-family:"EB Garamond",Garamond,Georgia,serif;font-weight:500;font-size:5mm;line-height:1}
  .who p{font-size:1.8mm;font-weight:700;letter-spacing:.42mm;text-transform:uppercase;margin-top:1.3mm;color:#6b6f95}
  .data{position:absolute;left:0;bottom:8.2mm;display:grid;grid-template-columns:auto 1fr;column-gap:2.2mm;row-gap:.55mm;font-size:1.95mm;line-height:1.3;color:var(--ink)}
  .data dt{font-family:"IBM Plex Mono",monospace;color:var(--navy);font-weight:500;font-size:1.6mm;padding-top:.2mm}
  .block{position:absolute;left:0;right:0;bottom:0;height:5.6mm;display:grid;grid-template-columns:auto 1fr 1fr 1fr auto;
    border:.25mm solid var(--navy);font-size:1.5mm;font-weight:700;letter-spacing:.28mm;text-transform:uppercase}
  .block > *{display:flex;align-items:center;justify-content:center;padding:0 1.6mm;border-left:.18mm solid var(--navy)}
  .block > :first-child{border-left:0;padding:0 1.2mm}
  .block img{height:3.9mm}
  .block .geo{background:var(--navy);color:#fff}

  @media screen{
    body{display:flex;flex-wrap:wrap;gap:10mm;padding:12mm;justify-content:center}
    .card{box-shadow:0 2mm 6mm rgba(0,0,0,.22)}
  }
</style>
</head>
