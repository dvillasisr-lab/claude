<!doctype html><html><head><meta charset="utf-8"><title>Heavy Metal · “THE EVIL ONE” 1/1</title>
<!--
PRINT SPEC (also written into cards.pdf: Info/XMP metadata and a non-printing note on each page; slug of cards-press.pdf)
US business card 3.5 x 2 in, bleed 0.125 in (document 3.75 x 2.25 in = 1125 x 675 px at 300 ppi).
Safe zone x 75..1050, y 75..600 px. TrimBox [9 9 261 153] pt, BleedBox = MediaBox.
cards.pdf is CMYK (DeviceCMYK, output intent GRACoL 2006 Coated), converted by the designer with these exact builds:
  ground #0A0A0B .......... C30 K100 (two-plate cool black; every knockout registers on 2 plates only)
  card frame, serial tab .. paper, 3 px = 0.72 pt keyline
  rules/ticks #3A3D42 ..... C30 K75 (same two plates as the ground: no knockout, cannot misregister)
  badge disc #16171A ...... C30 K88
  bone type, logo #F4F3EF . paper (knockout, no ink)
  yellow #F5C400 .......... M22 Y100 (trap: spread 0.1 mm into the black)
  QR modules .............. K100 only, on a paper tile (29 modules, 0.47 in, 0.41 mm per module, quiet zone 4.8+ modules)
  tractor photo ........... sRGB -> GRACoL 2006 Coated, relative colorimetric + BPC, TAC <= 300, 300 ppi
Smallest type 25 px = 6 pt (Plex Mono Bold, paper white). Hard proof on the chosen stock before the run.
-->
<style>
@font-face{font-family:BS;src:url(file://{{FONTS}}/BigShoulders-Bold.ttf)}
@font-face{font-family:Mono;src:url(file://{{FONTS}}/IBMPlexMono-Regular.ttf);font-weight:400}
@font-face{font-family:Mono;src:url(file://{{FONTS}}/IBMPlexMono-Bold.ttf);font-weight:700}
:root{--ink:#0A0A0B;--disc:#16171A;--paper:#F4F3EF;--rule:#3A3D42;--y:#F5C400}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#444;padding:20px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.card{position:relative;width:1125px;height:675px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Mono}
.abs{position:absolute}
.mono{white-space:nowrap;font-family:Mono;text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:25px;line-height:1}
.bs{font-family:BS;line-height:1;white-space:nowrap}
svg.logo{display:block;overflow:visible}
.rule{background:var(--rule)}
.yel{background:var(--y)}

/* ---------- FRONT ---------- */
#front .logo-line{width:{{LOGO_W}}px}
#front .evil{font-size:{{EVIL_FS}}px;color:var(--y);letter-spacing:.01em}

/* ---------- BACK ---------- */
#back .stat .v{font-family:BS;font-size:{{STAT_FS}}px;line-height:1;display:block;letter-spacing:.005em;white-space:nowrap}
#back .stat .v small{font-family:Mono;font-weight:700;font-size:25px;letter-spacing:.12em;margin-left:9px}
#back .ct{font-weight:400;text-transform:none;letter-spacing:0;font-size:{{CT_FS}}px;line-height:{{CT_LH}}px}
#back .ct i{font-style:normal;display:inline-block;width:{{CT_LBL}}px;font-size:25px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}

html.print body{background:none;padding:0;display:block}
html.print .card{break-after:page}
@page{size:3.75in 2.25in;margin:0}
</style></head><body>

<div class="card" id="front">
{{FRONT}}
</div>

<div class="card" id="back">
{{BACK}}
</div>

<script>
(async()=>{
 await document.fonts.ready;
 document.querySelectorAll('svg.logo').forEach(s=>{
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  while(s.firstChild) g.appendChild(s.firstChild); s.appendChild(g);
  const b=g.getBBox(); s.setAttribute('viewBox',`${b.x} ${b.y} ${b.width} ${b.height}`);
  s.style.height=(parseFloat(getComputedStyle(s).width)*b.height/b.width)+'px';
 });
 const cvs=document.createElement('canvas').getContext('2d');
 document.querySelectorAll('[data-base],[data-cap]').forEach(el=>{
  el.style.top='0px';
  const probe=document.createElement('span');probe.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
  el.appendChild(probe);
  const off=probe.getBoundingClientRect().top-el.getBoundingClientRect().top; probe.remove();
  let base;
  if(el.dataset.base!==undefined) base=+el.dataset.base;
  else{const cs=getComputedStyle(el);cvs.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;base=+el.dataset.cap+cvs.measureText('H').actualBoundingBoxAscent;}
  el.style.top=(base-off)+'px';
 });
 if(location.hash==='#print') document.documentElement.classList.add('print');
 document.body.dataset.ready='1';
})();
</script>
</body></html>
